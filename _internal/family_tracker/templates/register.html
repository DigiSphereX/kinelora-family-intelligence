<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinElora Family Intelligence - Register</title>
<link rel="icon" type="image/x-icon" href="/static/icon/family_tracker.ico">
<link rel="stylesheet" href="/static/vendor/tajawal.css">
<script src="/static/vendor/i18n.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0d0f1a;color:#e8eaf6;height:100vh;display:flex;align-items:center;justify-content:center;overflow-y:auto}
.login-box{background:#141625;border:1px solid #272b42;border-radius:20px;padding:40px 32px;width:430px;max-width:92%;box-shadow:0 12px 40px rgba(0,0,0,.5);text-align:center;position:relative}
.logo-img{width:min(300px,84%);aspect-ratio:1/1;object-fit:contain;margin:0 auto 14px;display:block;filter:drop-shadow(0 8px 26px rgba(245,197,24,.35))}
.sub{font-size:13px;color:#8890b5;margin-bottom:24px}
.field{margin-bottom:14px;text-align:right}
.field label{display:block;font-size:13px;color:#8890b5;margin-bottom:5px;font-weight:600}
.field input{width:100%;padding:10px 14px;background:#1a1d2e;border:1px solid #272b42;border-radius:10px;color:#e8eaf6;font-family:'Tajawal',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.field input:focus{border-color:#f5c518}
.error{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.2);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.btn{width:100%;padding:11px;background:linear-gradient(135deg,#f5c518,#c9a000);border:none;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:900;color:#1a1200;cursor:pointer;transition:all .2s;margin-top:4px}
.btn:hover{box-shadow:0 4px 14px rgba(245,197,24,.35);transform:translateY(-1px)}
.login-link{margin-top:16px;font-size:13px;color:#8890b5}
.login-link a{color:#f5c518;text-decoration:none;font-weight:700}
.login-link a:hover{text-decoration:underline}
body .lang-picker{position:fixed;top:18px;right:18px;z-index:120}
body .lang-picker .lp-panel{left:auto;right:0}
.legal{font-size:10px;color:#4a5070;margin-top:18px;direction:ltr}
</style>
</head>
<body>
<div class="login-box">
  <div class="lang-picker" data-lang-picker></div>
  <img class="logo-img" src="/static/img/logo.png" alt="KinElora">
  <div class="sub" data-i18n="register.subtitle">Create your own family tree</div>
  {% with messages = get_flashed_messages(category_filter=["error"]) %}
    {% if messages %}
      {% for msg in messages %}
        <div class="error">{{ msg }}</div>
      {% endfor %}
      <script>
      (function () {
        var arMap = null;
        function applyFlashes() {
          if (!arMap || typeof window.t !== 'function') return;
          var nodes = document.querySelectorAll('.login-box .error');
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            var key = el.getAttribute('data-flash-key');
            if (!key) {
              key = arMap[el.textContent.trim()];
              if (!key) continue;
              el.setAttribute('data-flash-key', key);
            }
            var s = window.t(key);
            if (s && s !== key) el.textContent = s;
          }
        }
        fetch('/static/vendor/i18n/ar.json')
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var m = {};
            for (var k in d) { if (k.indexOf('srv.') === 0) m[d[k]] = k; }
            arMap = m;
            applyFlashes();
          })
          .catch(function () {});
        if (document.readyState !== 'loading') applyFlashes();
        document.addEventListener('DOMContentLoaded', applyFlashes);
        document.addEventListener('i18n:ready', applyFlashes);
      })();
      </script>
    {% endif %}
  {% endwith %}
  <form method="POST">
    <div class="field">
      <label>🏠 <span data-i18n="register.familyName">Family name</span></label>
      <input type="text" name="family" data-i18n-ph="register.familyNamePlaceholder" required autofocus>
    </div>
    <div class="field">
      <label>🔑 <span data-i18n="register.password">Password</span></label>
      <input type="password" name="password" data-i18n-ph="register.passwordPlaceholder" required minlength="4">
    </div>
    <button class="btn" type="submit">✅ <span data-i18n="register.submit">Register</span></button>
  </form>
  <div class="login-link"><span data-i18n="register.haveAccount">Already have an account?</span> <a href="{{ url_for('login_page') }}" data-i18n="register.loginLink">Login</a></div>
  <div class="legal">© 2026 DigiSphereX — KinElora Family Intelligence v1.0.0</div>
</div>
</body>
</html>
